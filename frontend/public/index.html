<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Platform</title>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Transaction Platform</h1>
        </header>
        <main>
            <p>This is a mock of the transaction platform to process data to show the cloud architecture is working.</p>
            <form id="transaction-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="balance">Balance:</label>
                <input type="number" id="balance" name="balance" required>
                <label for="incoming">Incoming:</label>
                <input type="number" id="incoming" name="incoming" required>
                <label for="outgoing">Outgoing:</label>
                <input type="number" id="outgoing" name="outgoing" required>
                <button type="submit">Process Transaction</button>
            </form>
            <div id="result"></div>
        </main>
        <!-- <script src="../src/app.js"></script> - webpack will add this automatically -->
    </div>
</body>
</html>
